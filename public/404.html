<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>30 y siempre — Invitación</title>
    <!--
      Truco "spa-github-pages" (de rafgraph), mitad 2 de 2.
      GitHub Pages sirve este 404.html para CUALQUIER ruta que no sea
      un archivo real (ej: /cumple30/admin). Acá codificamos la ruta
      pedida como querystring y redirigimos a la raiz, donde el script
      de index.html la reconstruye antes de que React Router la lea.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // cantidad de segmentos del "base" (ej: /cumple30)
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
