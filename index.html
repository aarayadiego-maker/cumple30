<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>30 y siempre — Invitación</title>
    <meta name="description" content="Te invito a celebrar mis 15... 18 años después." />
    <link rel="icon" type="image/svg+xml" href="/cumple30/favicon.svg" />

    <!-- Open Graph: WhatsApp lee esto directo del HTML, sin ejecutar JS -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="30 y siempre" />
    <meta property="og:description" content="Te invito a celebrar mis 15... 18 años después." />
    <meta property="og:image" content="https://USUARIO.github.io/cumple30/og-image.jpg" />
    <meta property="og:url" content="https://USUARIO.github.io/cumple30/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="30 y siempre" />
    <meta name="twitter:description" content="Te invito a celebrar mis 15... 18 años después." />
    <meta name="twitter:image" content="https://USUARIO.github.io/cumple30/og-image.jpg" />

    <!--
      Truco "spa-github-pages" (de rafgraph): GitHub Pages es hosting
      estatico puro, no sabe redirigir /admin a index.html. Esto
      reconstruye la ruta original antes de que React Router la lea.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
